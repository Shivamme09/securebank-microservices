server:
  port: 8081                          # Each service gets its own port

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:userservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway manages schema, NOT Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true                   # Access H2 at http://localhost:8081/h2-console
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.securebank: DEBUG
    org.springframework.security: DEBUG