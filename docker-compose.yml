version: '3.8'

services:

  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: securebank-postgres
    environment:
      POSTGRES_DB: userservicedb
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # Persist data between restarts
    networks:
      - securebank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d userservicedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── User Service ──────────────────────────────────────────
  user-service:
    build:
      context: .                        # Build from project root
      dockerfile: user-service/Dockerfile
    container_name: securebank-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy      # Wait for DB to be ready before starting
    networks:
      - securebank-network
    restart: on-failure

# ─── Shared Network ────────────────────────────────────────
networks:
  securebank-network:
    driver: bridge

# ─── Persistent Volumes ────────────────────────────────────
volumes:
  postgres-data: